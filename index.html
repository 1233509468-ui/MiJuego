<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyberpunk Heist 2099</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            background-image: radial-gradient(#1f2833 15%, transparent 16%), radial-gradient(#1f2833 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }

        #pantalla-juego {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            max-height: 650px;
            position: relative;
            background-color: #151515;
            border: 5px solid #00ffcc;
            box-shadow: 0px 0px 20px #00ffcc;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
            margin: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #interfaz-superior {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .contenedor-barra {
            background: #000;
            border: 3px solid #ff0055;
            width: 150px;
            height: 22px;
            transform: skew(-10deg);
            overflow: hidden;
            box-shadow: 0px 0px 8px #ff0055;
        }

        #llenado-barra {
            width: 100%;
            height: 100%;
            background: #ff0055;
            transition: width 0.4s ease;
        }

        #marcador-puntos {
            background: #00ffcc;
            color: #000;
            border: 3px solid #000;
            padding: 4px 12px;
            font-size: 16px;
            font-weight: bold;
            transform: skew(-10deg) rotate(2deg);
            box-shadow: 4px 4px 0px #000;
        }

        #onomatopeya {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 60px;
            color: #fffb00;
            -webkit-text-stroke: 2px #000;
            text-shadow: 4px 4px 0px #ff0055;
            z-index: 40;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #caja-texto {
            position: absolute;
            bottom: 15px;
            left: 4%;
            width: 92%;
            height: 160px;
            background: rgba(11, 12, 16, 0.95);
            border: 4px solid #ff0055;
            padding: 15px 15px;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 10;
            box-shadow: 6px 6px 0px #000, 0px 0px 15px rgba(255, 0, 85, 0.4);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #nombre-personaje {
            font-family: 'Impact', sans-serif;
            font-size: 18px;
            text-transform: uppercase;
            color: #000;
            background: #00ffcc;
            border: 3px solid #000;
            padding: 2px 10px;
            display: inline-block;
            position: absolute;
            top: -20px;
            left: 15px;
            transform: rotate(-2deg);
            box-shadow: 3px 3px 0px #000;
        }

        #texto-dialogo {
            font-size: 15px;
            line-height: 1.4;
            font-weight: bold;
            color: #fff;
            margin-top: 8px;
        }

        #contenedor-opciones {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
            z-index: 20;
        }

        .boton-decision {
            background: #1f2833;
            color: #00ffcc;
            border: 3px solid #00ffcc;
            padding: 12px 8px;
            font-size: 15px;
            font-family: 'Impact', sans-serif;
            text-align: center;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 4px 4px 0px #000;
            transform: skew(-5deg);
            transition: all 0.1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .boton-decision:hover, .boton-decision:active {
            background: #00ffcc;
            color: #000;
            transform: skew(-5deg) scale(1.02);
            box-shadow: 5px 5px 0px #000;
        }

        .boton-salir {
            background: #ff0055 !important;
            color: white !important;
            border-color: #000 !important;
        }
        .boton-salir:hover, .boton-salir:active {
            background: #b3003b !important;
        }

        @media (max-width: 480px) {
            #onomatopeya { font-size: 45px; }
            #caja-texto { height: 170px; bottom: 10px; }
            #texto-dialogo { font-size: 14px; }
            #contenedor-opciones { width: 85%; top: 42%; }
            .boton-decision { font-size: 14px; padding: 10px 5px; }
        }
    </style>
</head>
<body>

    <div id="pantalla-juego">
        <div id="onomatopeya">ALERT!</div>

        <div id="interfaz-superior">
            <div>
                <span style="font-size: 11px; font-weight: bold; color: #ff0055; display:block; margin-bottom:2px;">DATA LINK / HP</span>
                <div class="contenedor-barra">
                    <div id="llenado-barra"></div>
                </div>
            </div>
            <div id="marcador-puntos">DATA STOLEN: 0%</div>
        </div>

        <div id="contenedor-opciones"></div>

        <div id="caja-texto" onclick="avanzarJuego()">
            <div id="nombre-personaje">SYSTEM</div>
            <div id="texto-dialogo">Initializing neural link...</div>
        </div>
    </div>

    <script>
        let progresoTesoro = 0;
        let energia = 100;
        let escenaActual = "inicio";

        const historia = {
            inicio: {
                personaje: "PANEL 1",
                texto: "Year 2099. Neon lights glitch outside. You have successfully bypassed the main gate of Cyber-Corp. Your mission: Download the top-secret Quantum AI Prototype.",
                imagen: "imagenes/neon_city.png",
                siguiente: "mission_brief"
            },
            mission_brief: {
                personaje: "NEURAL LINK",
                texto: "Your operator whispers through your cybernetic ear: 'The mainframe is guarded by a level-3 security barrier. You must solve the overrides in perfect English to remain undetected.'",
                imagen: "imagenes/cyber_deck.png",
                siguiente: "hack_1"
            },
            hack_1: {
                personaje: "SECURITY GATE 01",
                texto: "The terminal blinks red: 'IDENTIFICATION REQUIRED. Select the grammatically correct sentence to access the internal server corridor.'",
                imagen: "imagenes/security_gate.png",
                onomatopeya: "BEEP!",
                opciones: [
                    { texto: "She don't have the security key.", destino: "error_1" },
                    { texto: "She doesn't have the security key.", destino: "ok_1" },
                    { texto: "She hasn't the security key.", destino: "error_1" }
                ]
            },
            error_1: {
                personaje: "ALARM SYSTEM",
                texto: "ACCESS DENIED! The server runs a counter-hack sequence. A neuro-shock hits your brain rig, lowering your firewall link!",
                imagen: "imagenes/alarm.png",
                onomatopeya: "SHOCK!",
                restarEnergia: 25,
                siguiente: "hack_1"
            },
            ok_1: {
                personaje: "PANEL 2",
                texto: "ACCESS GRANTED! 'Doesn't' is correct for third-person singular negation. The heavy blast doors slide open silently. You run inside the cold server room.",
                imagen: "imagenes/server_room.png",
                onomatopeya: "ACCESS!",
                puntosSumar: 25,
                siguiente: "corridor_run"
            },
            corridor_run: {
                personaje: "PANEL 3",
                texto: "You pull out your fiber-optic cable and plug directly into the AI core capsule. The download begins, but an elite corporate cyborg guard walks into the room!",
                imagen: "imagenes/cyborg_guard.png",
                siguiente: "hack_2"
            },
            hack_2: {
                personaje: "CYBER COMBAT",
                texto: "Quick! You need to overload the guard's neural optical visor. Choose the past tense form of the verb 'CHOOSE' to upload the blinding virus code.",
                imagen: "imagenes/cyborg_guard.png",
                onomatopeya: "WARNING!",
                opciones: [
                    { texto: "I choosed the glitch exploit.", destino: "error_2" },
                    { texto: "I chosen the glitch exploit.", destino: "error_2" },
                    { texto: "I chose the glitch exploit.", destino: "ok_2" }
                ]
            },
            error_2: {
                personaje: "GUARD COUNTER",
                texto: "SYNTAX ERROR! The virus fails. The cyborg guard spots you and fires an electric net weapon directly at your chest!",
                imagen: "imagenes/cyborg_guard.png",
                onomatopeya: "ZAP!",
                restarEnergia: 25,
                siguiente: "hack_2"
            },
            ok_2: {
                personaje: "PANEL 4",
                texto: "CRITICAL HIT! 'Chose' is the correct simple past form of 'choose'. The guard's eyes spark violently as his visor overloads. He collapses to the floor!",
                imagen: "imagenes/cyborg_disabled.png",
                onomatopeya: "BOOM!",
                puntosSumar: 35,
                siguiente: "final_escape"
            },
            final_escape: {
                personaje: "PANEL 5",
                texto: "The download bar reaches 99%. A final prompt pops up on the screen: 'To finalize data encryption, input the word that means: A digital program that mimics human intelligence.'",
                imagen: "imagenes/ai_core.png",
                siguiente: "hack_3"
            },
            hack_3: {
                personaje: "ENCRYPTION CORE",
                texto: "The system is locking down in 5 seconds. What is the correct term for this technology?",
                imagen: "imagenes/ai_core.png",
                onomatopeya: "HURRY!",
                opciones: [
                    { texto: "Hardware Device", destino: "error_3" },
                    { texto: "Artificial Intelligence", destino: "ok_3" },
                    { texto: "Network Firewall", destino: "error_3" }
                ]
            },
            error_3: {
                personaje: "SYSTEM LOCK",
                texto: "WRONG DECRYPTION CODE! The core initiates a cryogenic purge blast. The extreme cold freezes your terminal connection.",
                imagen: "imagenes/ai_core.png",
                onomatopeya: "FREEZE!",
                restarEnergia: 30,
                siguiente: "hack_3"
            },
            ok_3: {
                personaje: "FINAL PANEL",
                texto: "SUCCESS! Artificial Intelligence (AI) accepted. The digital core unlocks completely. The prototype data stream flows smoothly into your neural memory drive.",
                imagen: "imagenes/data_secured.png",
                onomatopeya: "100%!",
                puntosSumar: 40,
                siguiente: "victoria"
            },
            victoria: {
                personaje: "MISSION ACCOMPLISHED!",
                texto: "INCREDIBLE! You jump out of the window into your hover-car just as security teams storm the room. The data is secure, and you are officially the best hacker in Neo-City. Play again?",
                imagen: "imagenes/hover_car.png",
                onomatopeya: "VICTORY!",
                opciones: [
                    { texto: "YES, START NEW RUN (RESTART)", destino: "reiniciar" },
                    { texto: "NO, DISCONNECT LINK (EXIT)", destino: "pantalla_negra", claseEspecial: "boton-salir" }
                ]
            },
            game_over: {
                personaje: "LINK SEVERED!",
                texto: "CRASH! Your neural firewall dropped to 0%. The corporate security systems wiped your memory rig, and you were captured by Cyber-Corp forces. Try again, runner?",
                imagen: "imagenes/gameover_cyber.png",
                onomatopeya: "FLATLINED!",
                opciones: [
                    { texto: "YES, RETRY SYSTEM HACK", destino: "reiniciar" },
                    { texto: "NO, ABORT MISSION", destino: "pantalla_negra", claseEspecial: "boton-salir" }
                ]
            },
            pantalla_negra: {
                personaje: "SYSTEM OFFLINE",
                texto: "Thank you for playing 'Cyberpunk Heist 2099'. Connection terminated successfully. You can now close this browser tab.",
                imagen: "",
                colorFondo: "#000000"
            }
        };

        function mostrarOnomatopeya(texto) {
            const el = document.getElementById("onomatopeya");
            el.innerText = texto;
            el.style.transform = "translate(-50%, -50%) scale(1.2) rotate(" + (Math.random() * 20 - 10) + "deg)";
            setTimeout(() => {
                el.style.transform = "translate(-50%, -50%) scale(0)";
            }, 800);
        }

        function renderizarEscena() {
            if (escenaActual === "reiniciar") {
                progresoTesoro = 0;
                energia = 100;
                escenaActual = "inicio";
                renderizarEscena();
                return;
            }

            const datosEscena = historia[escenaActual];

            if (datosEscena.onomatopeya) {
                mostrarOnomatopeya(datosEscena.onomatopeya);
            }

            if (datosEscena.puntosSumar) {
                progresoTesoro += datosEscena.puntosSumar;
                datosEscena.puntosSumar = 0; 
            }
            if (datosEscena.restarEnergia) {
                energia -= datosEscena.restarEnergia;
                datosEscena.restarEnergia = 0;
                
                if (energia <= 0) {
                    energia = 0;
                    escenaActual = "game_over";
                    renderizarEscena();
                    return;
                }
            }

            document.getElementById("marcador-puntos").innerText = `DATA STOLEN: ${progresoTesoro}%`;
            document.getElementById("llenado-barra").style.width = `${energia}%`;

            document.getElementById("nombre-personaje").innerText = datosEscena.personaje;
            document.getElementById("texto-dialogo").innerText = datosEscena.texto;
            
            if (datosEscena.imagen && datosEscena.imagen !== "") {
                document.getElementById("pantalla-juego").style.backgroundImage = `url('${datosEscena.imagen}')`;
            } else if (datosEscena.colorFondo) {
                document.getElementById("pantalla-juego").style.backgroundImage = "none";
                document.getElementById("pantalla-juego").style.backgroundColor = datosEscena.colorFondo;
            }

            const panelOpciones = document.getElementById("contenedor-opciones");
            panelOpciones.innerHTML = "";

            if (datosEscena.opciones) {
                document.getElementById("caja-texto").style.pointerEvents = "none";
                datosEscena.opciones.forEach(opcion => {
                    const boton = document.createElement("div");
                    boton.className = "boton-decision";
                    if (opcion.claseEspecial) {
                        boton.classList.add(opcion.claseEspecial);
                    }
                    boton.innerText = opcion.texto;
                    boton.onclick = () => {
                        escenaActual = opcion.destino;
                        renderizarEscena();
                    };
                    panelOpciones.appendChild(boton);
                });
            } else {
                document.getElementById("caja-texto").style.pointerEvents = "auto";
            }
        }

        function avanzarJuego() {
            const datosEscena = historia[escenaActual];
            if (datosEscena.siguiente) {
                escenaActual = datosEscena.siguiente;
                renderizarEscena();
            }
        }

        renderizarEscena();
    </script>
</body>
</html>
