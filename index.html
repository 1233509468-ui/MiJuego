<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Future Letter - Comic Final Edition</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            background-image: radial-gradient(#ccc 15%, transparent 16%), radial-gradient(#ccc 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            font-family: 'Impact', 'Arial Black', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #000;
            user-select: none;
        }

        #pantalla-juego {
            width: 900px;
            height: 550px;
            position: relative;
            background-color: #fff;
            border: 6px solid #000;
            box-shadow: 15px 15px 0px #000;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.3s ease;
        }

        #interfaz-superior {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 30;
        }

        .contenedor-barra {
            background: #fff;
            border: 4px solid #000;
            width: 220px;
            height: 25px;
            transform: skew(-10deg);
            overflow: hidden;
        }

        #llenado-barra {
            width: 100%;
            height: 100%;
            background: #ff0055;
            transition: width 0.4s ease;
        }

        #marcador-puntos {
            background: #fffb00;
            border: 4px solid #000;
            padding: 5px 15px;
            font-size: 20px;
            font-weight: bold;
            transform: skew(-10deg) rotate(2deg);
            box-shadow: 4px 4px 0px #000;
        }

        #onomatopeya {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 70px;
            color: #ffea00;
            -webkit-text-stroke: 3px #000;
            text-shadow: 5px 5px 0px #000;
            z-index: 40;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #caja-texto {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            height: 150px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid #000;
            padding: 15px 25px;
            box-sizing: border-box;
            cursor: pointer;
            z-index: 10;
            box-shadow: 8px 8px 0px #000;
            transform: rotate(-0.5deg);
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        #nombre-personaje {
            font-family: 'Impact', sans-serif;
            font-size: 24px;
            text-transform: uppercase;
            color: #fff;
            background: #ff5500;
            border: 3px solid #000;
            padding: 2px 10px;
            display: inline-block;
            position: absolute;
            top: -25px;
            left: 20px;
            transform: rotate(-3deg);
            box-shadow: 3px 3px 0px #000;
        }

        #texto-dialogo {
            font-size: 17px;
            line-height: 1.4;
            font-weight: bold;
            color: #111;
            margin-top: 10px;
        }

        #contenedor-opciones {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 60%;
            z-index: 20;
        }

        .boton-decision {
            background: #00e5ff;
            color: #000;
            border: 4px solid #000;
            padding: 12px;
            font-size: 16px;
            font-family: 'Impact', sans-serif;
            text-align: center;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 5px 5px 0px #000;
            transform: skew(-5deg);
            transition: all 0.1s ease;
        }

        .boton-decision:hover {
            background: #fffb00;
            transform: skew(-5deg) scale(1.03);
            box-shadow: 7px 7px 0px #000;
        }

        /* Color especial para el botón de salir de la historieta */
        .boton-salir {
            background: #ff4d4d !important;
            color: white !important;
        }
        .boton-salir:hover {
            background: #b30000 !important;
        }
    </style>
</head>
<body>

    <div id="pantalla-juego">
        <div id="onomatopeya">¡BOOM!</div>

        <div id="interfaz-superior">
            <div>
                <span style="font-size: 14px; font-weight: bold; color: #fff; background: #000; padding: 2px 5px; display:block; margin-bottom:2px;">ENERGÍA / HP</span>
                <div class="contenedor-barra">
                    <div id="llenado-barra"></div>
                </div>
            </div>
            <div id="marcador-puntos">TESORO: 0%</div>
        </div>

        <div id="contenedor-opciones"></div>

        <div id="caja-texto" onclick="avanzarJuego()">
            <div id="nombre-personaje">NARRADOR</div>
            <div id="texto-dialogo">Cargando viñetas...</div>
        </div>
    </div>

    <script>
        let progresoTesoro = 0;
        let energia = 100;
        let escenaActual = "inicio";

        const historia = {
            inicio: {
                personaje: "VIÑETA 1",
                texto: "¡BUM! Abres un viejo casillero abandonado y un artefacto proyecta un holograma brillante. Es una CARTA DEL FUTURO firmada en el año 2080. El texto parpadea mezclando idiomas...",
                imagen: "imagenes/holograma.jpg",
                siguiente: "carta_lectura_1"
            },
            carta_lectura_1: {
                personaje: "CARTA DEL 2080",
                texto: "'¡Hola antepasado! Si estás leyendo esto, el tesoro de la humanidad (la clave de la energía limpia) está oculto en tu época. Para encontrar las coordenadas, debes descifrar mis pistas bilingües...'",
                imagen: "imagenes/holograma.jpg",
                siguiente: "desafio_1"
            },
            desafio_1: {
                personaje: "ACERTIJO DE LA CARTA",
                texto: "'Pista 1: El mapa te guiará al cofre solo si entiendes este mensaje: Look at the sky, I am where the sun sets. ¿Hacia dónde debes caminar según la carta?'",
                imagen: "imagenes/holograma.jpg",
                onomatopeya: "¡CLICK!",
                opciones: [
                    { texto: "Hacia el Norte (North)", destino: "error_1" },
                    { texto: "Hacia el Este donde sale el sol (East)", destino: "error_1" },
                    { texto: "Hacia el Oeste donde se oculta el sol (West)", destino: "ok_1" }
                ]
            },
            error_1: {
                personaje: "VIÑETA DE FALLO",
                texto: "¡ZAP! Caminas en la dirección equivocada. Una trampa oculta se activa y te golpea, haciéndote perder tiempo y energía.",
                imagen: "imagenes/bunker.jpg",
                onomatopeya: "¡ZAP!",
                restarEnergia: 25,
                siguiente: "desafio_1"
            },
            ok_1: {
                personaje: "VIÑETA 2",
                texto: "¡Exacto! 'Where the sun sets' significa donde el sol se oculta, es decir, el Oeste (West). Sigues caminando y el mapa de la carta se actualiza. ¡Te adentras en el viejo búnker!",
                imagen: "imagenes/bunker.jpg",
                onomatopeya: "¡BIEN!",
                puntosSumar: 25,
                siguiente: "capitulo_2"
            },
            capitulo_2: {
                personaje: "VIÑETA 3",
                texto: "Llegas a las coordenadas de la carta: un viejo sótano industrial. En el centro hay un guardián robótico oxidado custodiando la cápsula del tesoro. La carta del futuro te advierte qué decir.",
                imagen: "imagenes/robot.jpg",
                siguiente: "desafio_2"
            },
            desafio_2: {
                personaje: "CARTA DEL 2080",
                texto: "'Pista 2: Para apagar el robot debes usar la orden cortés en pasado. Completa la frase: Yesterday, I ________ (deactivate) the defense protocol'.",
                imagen: "imagenes/robot.jpg",
                onomatopeya: "¡RUN!",
                opciones: [
                    { texto: "deactivated", destino: "ok_2" },
                    { texto: "deactivates", destino: "error_2" },
                    { texto: "deactivating", destino: "error_2" }
                ]
            },
            error_2: {
                personaje: "SISTEMA ROBÓTICO",
                texto: "¡PUM! Comando inválido. El robot se defiende lanzando una ráfaga de vapor caliente hacia ti.",
                imagen: "imagenes/robot.jpg",
                onomatopeya: "¡POW!",
                restarEnergia: 25,
                siguiente: "desafio_2"
            },
            ok_2: {
                personaje: "VIÑETA 4",
                texto: "¡LOGRADO! 'Deactivated' es el pasado correcto. El robot parpadea, dobla sus rodillas mecánicas y entra en modo suspensión. ¡La cápsula está al descubierto!",
                imagen: "imagenes/robot.jpg",
                onomatopeya: "¡ZAS!",
                puntosSumar: 35,
                siguiente: "capitulo_3"
            },
            capitulo_3: {
                personaje: "VIÑETA 5",
                texto: "Estás frente al cofre metálico del futuro. Tiene una pantalla táctil donde debes escribir la palabra clave final en inglés basada en la última advertencia de la carta.",
                imagen: "imagenes/cofre.jpg",
                siguiente: "desafio_3"
            },
            desafio_3: {
                personaje: "ÚLTIMA PISTA",
                texto: "'Pista final: El tesoro no es oro ni joyas. El verdadero tesoro del futuro es algo que adquieres cuando estudias y lees mucho. It starts with 'K' and ends with 'E': KNOWLEDGE. ¿Qué significa?'",
                imagen: "imagenes/cofre.jpg",
                onomatopeya: "¡PIENSA!",
                opciones: [
                    { texto: "Dinero / Riqueza", destino: "error_3" },
                    { texto: "Conocimiento / Sabiduría", destino: "ok_3" },
                    { texto: "Poder / Fuerza", destino: "error_3" }
                ]
            },
            error_3: {
                personaje: "CANDADO LÁSER",
                texto: "¡CRASH! Código incorrecto. Los sistemas bloquean la tapa del cofre y te dan una fuerte descarga electrostática.",
                imagen: "imagenes/cofre.jpg",
                onomatopeya: "¡BOOM!",
                restarEnergia: 30,
                siguiente: "desafio_3"
            },
            ok_3: {
                personaje: "VIÑETA FINAL",
                texto: "¡SÍ! 'Knowledge' significa conocimiento. La carta del futuro tenía razón: aprender es la mayor riqueza. La compuerta se abre liberando un destello cegador.",
                imagen: "imagenes/cofre.jpg",
                onomatopeya: "¡SUCCESS!",
                puntosSumar: 40,
                siguiente: "victoria"
            },
            
            // --- NUEVAS PANTALLAS DE FINAL COMPLETO (SIN BUCLE) ---
            victoria: {
                personaje: "¡FIN DE LA HISTORIETA!",
                texto: "¡FANTÁSTICO! El cofre contiene planos mecánicos para salvar el medio ambiente y un mensaje final: '¡Lo lograste, tu inglés salvó al mundo!'. Has completado la novela gráfica bilingüe al 100%. ¿Quieres jugar de nuevo?",
                imagen: "imagenes/cofre.jpg",
                onomatopeya: "¡WINNER!",
                opciones: [
                    { texto: "¡SÍ, JUGAR DE NUEVO! (RESTART)", destino: "reiniciar" },
                    { texto: "NO, SALIR DEL JUEGO (EXIT)", destino: "pantalla_negra", claseEspecial: "boton-salir" }
                ]
            },
            game_over: {
                personaje: "¡FIN DE LA EDICIÓN!",
                texto: "¡CRASH! Tu energía llegó a cero. Te desmayaste antes de abrir el cofre y la carta holográfica se apagó para siempre. ¿Quieres reintentar la misión?",
                imagen: "imagenes/gameover.jpg",
                onomatopeya: "¡FAIL!",
                opciones: [
                    { texto: "SÍ, INTENTAR DE NUEVO (RETRY)", destino: "reiniciar" },
                    { texto: "NO, SALIR DEL JUEGO (EXIT)", destino: "pantalla_negra", claseEspecial: "boton-salir" }
                ]
            },
            pantalla_negra: {
                personaje: "HISTORIETA CERRADA",
                texto: "Gracias por jugar 'The Future Letter'. La transmisión desde el 2080 se ha cortado permanentemente. Puedes cerrar esta pestaña de tu navegador.",
                imagen: "",
                colorFondo: "#000000"
            }
        };

        function mostrarOnomatopeya(texto) {
            const el = document.getElementById("onomatopeya");
            el.innerText = texto;
            el.style.transform = "translate(-50%, -50%) scale(1.3) rotate(" + (Math.random() * 20 - 10) + "deg)";
            setTimeout(() => {
                el.style.transform = "translate(-50%, -50%) scale(0)";
            }, 800);
        }

        function renderizarEscena() {
            if (escenaActual === "reiniciar") {
                progresoTesoro = 0;
                energia = 100;
                escenaActual = "inicio";
                renderizarEscena();
                return;
            }

            const datosEscena = historia[escenaActual];

            if (datosEscena.onomatopeya) {
                mostrarOnomatopeya(datosEscena.onomatopeya);
            }

            if (datosEscena.puntosSumar) {
                progresoTesoro += datosEscena.puntosSumar;
                datosEscena.puntosSumar = 0; 
            }
            if (datosEscena.restarEnergia) {
                energia -= datosEscena.restarEnergia;
                datosEscena.restarEnergia = 0;
                
                if (energia <= 0) {
                    energia = 0;
                    escenaActual = "game_over";
                    renderizarEscena();
                    return;
                }
            }

            document.getElementById("marcador-puntos").innerText = `TESORO: ${progresoTesoro}%`;
            document.getElementById("llenado-barra").style.width = `${energia}%`;

            document.getElementById("nombre-personaje").innerText = datosEscena.personaje;
            document.getElementById("texto-dialogo").innerText = datosEscena.texto;
            
            // Control inteligente de fondos
            if (datosEscena.imagen && datosEscena.imagen !== "") {
                document.getElementById("pantalla-juego").style.backgroundImage = `url('${datosEscena.imagen}')`;
            } else if (datosEscena.colorFondo) {
                document.getElementById("pantalla-juego").style.backgroundImage = "none";
                document.getElementById("pantalla-juego").style.backgroundColor = datosEscena.colorFondo;
            }

            const panelOpciones = document.getElementById("contenedor-opciones");
            panelOpciones.innerHTML = "";

            if (datosEscena.opciones) {
                document.getElementById("caja-texto").style.pointerEvents = "none";
                datosEscena.opciones.forEach(opcion => {
                    const boton = document.createElement("div");
                    boton.className = "boton-decision";
                    if (opcion.claseEspecial) {
                        boton.classList.add(opcion.claseEspecial);
                    }
                    boton.innerText = opcion.texto;
                    boton.onclick = () => {
                        escenaActual = opcion.destino;
                        renderizarEscena();
                    };
                    panelOpciones.appendChild(boton);
                });
            } else {
                document.getElementById("caja-texto").style.pointerEvents = "auto";
            }
        }

        function avanzarJuego() {
            const datosEscena = historia[escenaActual];
            if (datosEscena.siguiente) {
                escenaActual = datosEscena.siguiente;
                renderizarEscena();
            }
        }

        renderizarEscena();
    </script>
</body>
</html>
